<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Browse — tictacjoe</title>
<link rel="stylesheet" type="text/css" href="https://tictacjoe.github.io/css/main.css">
<style>
  body { max-width: 1200px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 24px;
    font-family: 'Helvetica', 'Arial', sans-serif;
    font-size: 0.92em;
  }
  .control-group { min-width: 180px; }
  .control-group h3 {
    font-size: 0.8em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #555;
    margin: 0 0 8px;
    border-bottom: 1px solid #e8e8e8;
    padding-bottom: 4px;
  }
  .control-group label {
    display: block;
    margin-bottom: 4px;
    cursor: pointer;
    color: #333;
  }

  .genre-btn {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px 3px 2px 0;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 0.82em;
    color: #444;
    background: #f8f8f8;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
    font-family: 'Helvetica', 'Arial', sans-serif;
  }
  .genre-btn:hover, .genre-btn.selected { background: #e8f0ff; border-color: #2a6db5; color: #2a6db5; }
  .genre-btn.selected { font-weight: bold; }

  .mode-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 4px;
  }
  .mode-row label { cursor: pointer; color: #333; }
  .mode-row input[type="radio"] { margin-right: 4px; }
  .mode-hint { font-size: 0.78em; color: #999; margin-top: 4px; display: block; }

  .sort-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .sort-btn {
    padding: 3px 10px;
    border: 1px solid #e0e0e0;
    background: #fff;
    color: #555;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Helvetica', 'Arial', sans-serif;
    font-size: 0.82rem;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .sort-btn:hover { border-color: #2a6db5; color: #2a6db5; }
  .sort-btn.active { border-color: #2a6db5; color: #2a6db5; font-weight: bold; }
  .sort-btn .sort-rank {
    background: #2a6db5; color: #fff; border-radius: 50%;
    width: 15px; height: 15px; font-size: 0.62rem;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
  }

  .search-btn {
    background: #2a6db5;
    color: #fff;
    border: none;
    padding: 10px 28px;
    font-family: 'Helvetica', 'Arial', sans-serif;
    font-size: 0.95em;
    font-weight: bold;
    letter-spacing: 0.03em;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 24px;
    margin-top: 12px;
  }
  .search-btn:hover { background: #1a4d8a; }
  .search-btn:disabled { background: #aaa; cursor: default; }

  .status {
    font-family: 'Helvetica', 'Arial', sans-serif;
    font-size: 0.9em;
    color: #666;
    margin-bottom: 12px;
    min-height: 1.4em;
  }
  .status.error { color: #c0392b; }

  .table-wrap { overflow-x: auto; margin-top: 24px; }
  table {
    border-collapse: collapse;
    font-family: 'Helvetica', 'Arial', sans-serif;
    font-size: 0.85em;
    width: 100%;
    min-width: 900px;
  }
  th {
    text-align: left;
    padding: 6px 12px 6px 0;
    border-bottom: 2px solid #222;
    font-size: 0.8em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #444;
    white-space: nowrap;
    cursor: pointer;
  }
  th:hover { color: #2a6db5; }
  th.sort-active { color: #2a6db5; }
  td {
    padding: 5px 12px 5px 0;
    border-bottom: 1px solid #eee;
    vertical-align: top;
    color: #333;
  }
  tr:hover td { background: #f5f8ff; }
  td.genre-cell { color: #555; font-size: 0.82em; }
  td.num { text-align: right; padding-right: 16px; }
  th.num { text-align: right; padding-right: 16px; }

  .rt-na     { color: #aaa; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #ddd; border-top-color: #2a6db5;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 0.3rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sub-genre-card {
    display: inline-flex;
    flex-direction: column;
    padding: 12px 20px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    text-decoration: none;
    color: #222;
    margin-bottom: 32px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sub-genre-card:hover { border-color: #2a6db5; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; }
  .sub-genre-card strong { font-family: Helvetica, Arial, sans-serif; font-size: 0.95em; color: #111; margin-bottom: 2px; }
  .sub-genre-card span { font-family: Helvetica, Arial, sans-serif; font-size: 0.78em; color: #888; }

  @media (max-width: 600px) {
    .controls { flex-direction: column; }
    .project-card { width: 100%; }
  }
</style>
</head>
<body>

<nav>
  <ul>
    <li><a href="https://tictacjoe.github.io/">Home</a></li>
    <li><a href="https://github.com/tictacjoe">GitHub</a></li>
  </ul>
</nav>

<div class="container">
  <a href="https://tictacjoe.github.io/">
    <img src="https://tictacjoe.github.io/pics/weblake.png"
         alt="Lake view"
         class="hero-image">
  </a>

  <h1>Netflix Browse</h1>

  <div style="text-align:center;">
    <a href="codes.html" class="sub-genre-card">
      <strong>Browse by Sub-genre</strong>
      <span>1860 Netflix micro-genre codes</span>
    </a>
  </div>

  <div class="controls">
    <div class="control-group" style="flex: 1; min-width: 300px;">
      <h3>Genres <small style="font-weight:normal;text-transform:none;letter-spacing:0">(click to select)</small></h3>
      <div id="genreGrid" style="line-height: 1.8;">
        <span style="color:#888;font-size:0.85rem">Loading genres…</span>
      </div>
    </div>

    <div class="control-group">
      <h3>Filter Mode</h3>
      <div class="mode-row">
        <label><input type="radio" name="mode" value="OR" checked onclick="setMode('OR')"> OR</label>
        <label><input type="radio" name="mode" value="AND" onclick="setMode('AND')"> AND</label>
      </div>
      <span class="mode-hint" id="modeHint">Any selected genre</span>
    </div>

    <div class="control-group">
      <h3>Sort Order</h3>
      <div class="sort-row">
        <button class="sort-btn" data-key="year" onclick="toggleSort('year')">Year</button>
        <button class="sort-btn" data-key="imdb" onclick="toggleSort('imdb')">IMDB</button>
        <button class="sort-btn" data-key="rt"   onclick="toggleSort('rt')"  >RT%</button>
      </div>
    </div>
  </div>

  <button class="search-btn" id="searchBtn" onclick="runSearch()">Browse Netflix</button>
  <div class="status" id="status"></div>

  <div class="table-wrap" id="resultsWrap" style="display:none">
    <div id="resultsCount" style="font-family:Helvetica,Arial,sans-serif; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:#888; margin-bottom:8px;"></div>
    <table>
      <thead>
        <tr>
          <th onclick="tableSort('genre')"   >Genre</th>
          <th onclick="tableSort('title')"   >Title</th>
          <th onclick="tableSort('year')"    class="num">Year</th>
          <th onclick="tableSort('imdb')"    class="num">IMDB</th>
          <th onclick="tableSort('rt')"      class="num">RT%</th>
          <th onclick="tableSort('director')">Director</th>
          <th onclick="tableSort('lead1')"   >Lead 1</th>
          <th onclick="tableSort('lead2')"   >Lead 2</th>
          <th onclick="tableSort('lead3')"   >Lead 3</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<footer>
  <ul>
    <li><a href="mailto:tictacjoe@gmail.com">email</a></li>
    <li><a href="https://github.com/tictacjoe">github.com/tictacjoe</a></li>
    <li>Powered by <a href="https://www.justwatch.com">JustWatch</a></li>
  </ul>
</footer>

<script>
let PROXY = localStorage.getItem('nfx_proxy') || 'https://netflix-browse.tictacjoe.workers.dev';
let genres = [], selected = new Set(), mode = 'OR';
let sortOrder = [], tableRows = [], tableSortKey = null, tableSortDir = 1;

async function gql(query, variables = {}) {
  const r = await fetch(PROXY, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  return r.json();
}

async function loadGenres() {
  const data = await gql('query { genres { shortName translation(language: en) } }');
  genres = (data.data.genres || []).sort((a,b) => a.translation.localeCompare(b.translation));
  renderGenreGrid();
}

function renderGenreGrid() {
  const grid = document.getElementById('genreGrid');
  grid.innerHTML = '';
  genres.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'genre-btn' + (selected.has(g.shortName) ? ' selected' : '');
    btn.textContent = g.translation;
    btn.onclick = () => toggleGenre(g.shortName, btn);
    grid.appendChild(btn);
  });
}

function toggleGenre(shortName, btn) {
  if (selected.has(shortName)) { selected.delete(shortName); btn.classList.remove('selected'); }
  else { selected.add(shortName); btn.classList.add('selected'); }
}

function setMode(m) {
  mode = m;
  document.getElementById('modeHint').textContent =
    m === 'OR' ? 'Any selected genre' : 'Must match ALL selected genres';
}

const SORT_DIR = { year: 1, imdb: -1, rt: -1 };

function toggleSort(key) {
  const idx = sortOrder.indexOf(key);
  if (idx === -1) { sortOrder.push(key); } else { sortOrder.splice(idx, 1); }
  renderSortButtons();
}

function renderSortButtons() {
  document.querySelectorAll('.sort-btn').forEach(btn => {
    const key = btn.dataset.key;
    const rank = sortOrder.indexOf(key);
    btn.classList.toggle('active', rank !== -1);
    const existing = btn.querySelector('.sort-rank');
    if (existing) existing.remove();
    if (rank !== -1 && sortOrder.length > 1) {
      const badge = document.createElement('span');
      badge.className = 'sort-rank';
      badge.textContent = rank + 1;
      btn.prepend(badge);
    }
  });
}

const MOVIE_QUERY = `
query GetPopularTitles($country: Country!, $language: Language!, $first: Int!, $filter: TitleFilter) {
  popularTitles(country: $country, first: $first, filter: $filter) {
    edges { node { content(country: $country, language: $language) {
      title originalReleaseYear credits { role name } scoring { imdbScore tomatoMeter }
    } } }
  }
}`;

async function fetchMovies(genreList) {
  const data = await gql(MOVIE_QUERY, {
    country: 'US', language: 'en', first: 100,
    filter: { objectTypes: ['MOVIE'], packages: ['nfx'], genres: genreList }
  });
  const label = genreList.map(s => genres.find(g => g.shortName === s)?.translation || s).join('/');
  const results = {};
  for (const edge of data.data.popularTitles.edges) {
    const c = edge.node.content;
    const credits = c.credits || [];
    const directors = credits.filter(x => x.role === 'DIRECTOR').map(x => x.name);
    const actors    = credits.filter(x => x.role === 'ACTOR').map(x => x.name).slice(0, 3);
    results[c.title] = {
      genre: label, title: c.title, year: c.originalReleaseYear ?? null,
      imdb: c.scoring?.imdbScore ?? null, rt: c.scoring?.tomatoMeter ?? null,
      director: directors[0] || '', lead1: actors[0] || '', lead2: actors[1] || '', lead3: actors[2] || '',
    };
  }
  return results;
}

async function runSearch() {
  if (selected.size === 0) { setStatus('Please select at least one genre.', true); return; }
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  setStatus('<span class="spinner"></span> Fetching…');
  document.getElementById('resultsWrap').style.display = 'none';
  try {
    const genreList = [...selected];
    let rows;
    if (mode === 'OR') {
      rows = Object.values(await fetchMovies(genreList));
    } else {
      const sets = [];
      for (const g of genreList) {
        setStatus(`<span class="spinner"></span> Fetching ${genres.find(x => x.shortName === g)?.translation}…`);
        sets.push(await fetchMovies([g]));
      }
      const common = Object.keys(sets[0]).filter(t => sets.every(s => t in s));
      rows = common.map(t => {
        const row = { ...sets[0][t] };
        row.genre = sets.map((s,i) => genres.find(x => x.shortName === genreList[i])?.translation || genreList[i]).join(' & ');
        return row;
      });
    }
    tableRows = rows;
    applySort();
    renderTable();
    setStatus('');
  } catch(e) {
    setStatus('Error fetching data.', true);
    console.error(e);
  }
  btn.disabled = false;
}

function applySort() {
  const keys = sortOrder.length ? sortOrder : ['rt'];
  [...keys].reverse().forEach(key => {
    const dir = SORT_DIR[key];
    tableRows.sort((a, b) => {
      const av = a[key] ?? (dir === 1 ? Infinity : -Infinity);
      const bv = b[key] ?? (dir === 1 ? Infinity : -Infinity);
      return av < bv ? dir : av > bv ? -dir : 0;
    });
  });
}

function tableSort(key) {
  if (tableSortKey === key) { tableSortDir *= -1; }
  else { tableSortKey = key; tableSortDir = ['year','title','genre','director','lead1','lead2','lead3'].includes(key) ? 1 : -1; }
  tableRows.sort((a, b) => {
    const av = a[key] ?? ''; const bv = b[key] ?? '';
    return av < bv ? tableSortDir : av > bv ? -tableSortDir : 0;
  });
  document.querySelectorAll('th').forEach(th => th.classList.remove('sort-active'));
  event.target.classList.add('sort-active');
  renderTableBody();
}

function renderTable() {
  document.getElementById('resultsCount').textContent =
    `${tableRows.length} movie${tableRows.length !== 1 ? 's' : ''} found`;
  document.getElementById('resultsWrap').style.display = 'block';
  renderTableBody();
}

function renderTableBody() {
  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';
  tableRows.forEach(r => {
    const tr = document.createElement('tr');
    const rtClass = r.rt === null ? 'rt-na' : r.rt >= 60 ? 'rt-fresh' : 'rt-rotten';
    tr.innerHTML = `
      <td class="genre-cell">${esc(r.genre)}</td>
      <td>${esc(r.title)}</td>
      <td class="num">${r.year ?? '—'}</td>
      <td class="num">${r.imdb !== null ? r.imdb.toFixed(1) : '—'}</td>
      <td class="num ${rtClass}">${r.rt !== null ? r.rt + '%' : '—'}</td>
      <td>${esc(r.director)}</td>
      <td>${esc(r.lead1)}</td>
      <td>${esc(r.lead2)}</td>
      <td>${esc(r.lead3)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setStatus(msg, isError=false) {
  const el = document.getElementById('status');
  el.innerHTML = msg; el.className = 'status' + (isError ? ' error' : '');
}

loadGenres();
</script>
</body>
</html>
